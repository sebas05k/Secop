name: Alertas SECOP

on:
  schedule:
    # Corre a las 12:00 UTC (7:00 a. m. hora Colombia)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  alertas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías necesarias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests gspread google-auth

      - name: Ejecutar script de alertas
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python alertas.py
